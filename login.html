<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIFF 2026 | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/miff.css">
</head>
<body style="justify-content: center; align-items: center; padding-top: 0;">
    <div class="glass p-5 animate-up" style="width: 100%; max-width: 450px; text-align: center;">
        <a href="index.html"><img src="https://miff.in/assets/images/logo.png" alt="MIFF Logo" style="height: 60px; margin-bottom: 2rem;" onerror="this.src='https://via.placeholder.com/150x50?text=MIFF+LOGO'"></a>
        
        <h2 style="font-weight: 800; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="opacity: 0.7; margin-bottom: 2rem;">Login to access your accreditation dashboard.</p>

        <form>
            <div class="form-group" style="text-align: left;">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Enter your password">
            </div>
            <div style="text-align: right; margin-bottom: 1.5rem;">
                <a href="#" style="color: var(--miff-gold); text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-miff w-100" style="width: 100%;">Login</button>
        </form>

        <div style="margin-top: 2rem; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem;">
            <p style="opacity: 0.7; font-size: 0.9rem;">Don't have an account?</p>
            <a href="index.html" style="color: var(--miff-gold); text-decoration: none; font-weight: 600;">Create an Account</a>
        </div>
    </div>

    <div style="position: fixed; bottom: 2rem; width: 100%; text-align: center; opacity: 0.5; font-size: 0.8rem;">
        &copy; 2026 Mumbai International Film Festival
    </div>
</body>
</html>
